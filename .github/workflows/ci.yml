name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and replay evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
      - run: python scripts/evaluate_replay.py

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  deploy:
    name: Deploy main to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, compose]
    runs-on: ubuntu-latest
    concurrency:
      group: production-ec2
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST" >&2; exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER" >&2; exit 1)
          test -n "$EC2_SSH_PRIVATE_KEY" || (echo "Missing EC2_SSH_PRIVATE_KEY" >&2; exit 1)
          test -n "$EC2_KNOWN_HOSTS" || (echo "Missing EC2_KNOWN_HOSTS" >&2; exit 1)

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/replan-ec2"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/replan-ec2" "$HOME/.ssh/known_hosts"

      - name: Pull main and restart Compose on EC2
        run: |
          ssh \
            -i "$HOME/.ssh/replan-ec2" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" <<'REMOTE'
          set -eu
          cd "$HOME/ai-innovators-challenge"
          test -z "$(git status --porcelain)" || {
            echo "EC2 working tree is dirty; refusing to deploy over local changes." >&2
            exit 1
          }
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:3000/
          REMOTE
